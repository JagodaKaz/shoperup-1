<!DOCTYPE html>
    <html lang="pl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Formularz</title>
        </head>
        <body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Strona główna</a></li>
                <li><a href="#">O nas</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>
                
            </header>
            <main>
                <section>
                    <h1>Kontakt</h1>
                </section>
                <section>
                    <h2>Formularz kontaktowy</h2>
                    <form action="#">
                        <div>
                            <label for="first-name">Imię:</label>
                             <input id="first-name" name="first-name" type="text">
                        </div>
                        <div>
                            <label for="last-name">Nazwisko:</label>
                             <input id="last-name" name="last-name" type="text">
                        </div>
                        <div>
                            <label for="adress-email">Adres E-mail:</label>
                             <input id="adress-email" name="adress-email" type="text">
                        </div>
                        <div>
                            <label for="phone-number">Numer telefonu:</label>
                            <input id="phone-number" name="phone-number" placeholder="+48 000-000-000" type="number">
                        </div>
                        <div>
                            <label for="topic"></label>Temat wiadomości</label>
                            <select name="topic" id="topic">
                                <option value="kot">Pytanie o kota</option>
                                <option value="pies">Pytanie o psa</option>
                                <option value="kura">Pytanie o kure</option>
                                <option value="krowa">Pytanie o krowe</option>
                            </select>
                        </div>
                        <div>
                            <label for="message">Treść wiadomości</label>
                            <textarea name="message" id="message"></textarea>
                        </div>
                        <div>
                            <input name="terms" id="terms" type="checkbox">
                            <label for="terms">
                                Potwierdzam
                            </label>
                            <input value="Wyślij" type="submit">
                        </div>
                    </form>
                        
                </section>
            </main>
        <footer>
        <p>&copy; 2025 Kotowo. Wszystkie prawa zastrzeżone.</p>
        </footer>
        </body>
        </html>
